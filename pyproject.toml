[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-timing-analysis"
version = "0.1.0"
description = "Python pipeline for TULSA timing reconstruction and Gantt outputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
